<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clases de DJ — NAYA</title>
<meta name="description" content="Clases de DJ con NAYA. Ingresá con tu clave.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,opsz,wght@0,9..144,450;1,9..144,450&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0a0a; --bg-raised:#15120f; --line:#2e2620;
    --text:#f2ede4; --text-muted:#a89d8e; --text-faint:#6f665c;
    --gold:#e8b04a; --gold-soft:#8a6c2f; --terra:#e0653a; --sand:#cbb389;
    --font-display:"Fraunces",ui-serif,Georgia,serif;
    --font-poster:"Anton",ui-sans-serif,sans-serif;
    --font-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
    --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",monospace;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased; }
  a{ color:inherit; }
  header.top{ border-bottom:1px solid var(--line); }
  header.top .inner{ max-width:760px; margin:0 auto; padding:.9rem 1.4rem; display:flex; justify-content:space-between; align-items:center; font-family:var(--font-mono); font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); }
  header.top a{ text-decoration:none; }
  header.top a:hover{ color:var(--gold); }
  main{ flex:1; display:flex; align-items:center; }
  .wrap{ max-width:760px; margin:0 auto; padding:3.5rem 1.4rem 5rem; width:100%; }
  .eyebrow{ font-family:var(--font-mono); font-size:.7rem; letter-spacing:.24em; text-transform:uppercase; color:var(--gold); margin-bottom:.9rem; }
  h1{ font-family:var(--font-poster); font-weight:400; text-transform:uppercase; font-size:clamp(3.2rem,13vw,6rem); line-height:.86; margin:0 0 1rem; }
  .bajada{ font-family:var(--font-display); font-style:italic; color:var(--sand); font-size:clamp(1.05rem,2.4vw,1.3rem); margin:0 0 2.2rem; max-width:34ch; }
  form{ display:flex; flex-wrap:wrap; gap:.6rem; max-width:26rem; }
  input{ flex:1 1 12rem; font:inherit; font-family:var(--font-mono); font-size:.95rem; color:var(--text); background:var(--bg-raised); border:1px solid var(--line); padding:.8rem 1rem; border-radius:0; }
  input:focus{ outline:none; border-color:var(--gold-soft); }
  button{ font-family:var(--font-mono); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); background:transparent; border:1px solid var(--gold-soft); padding:.8rem 1.2rem; cursor:pointer; transition:background .15s,color .15s; }
  button:hover{ background:var(--gold); color:#1a1408; }
  .msg{ min-height:1.6rem; margin:.9rem 0 0; font-family:var(--font-mono); font-size:.78rem; color:var(--terra); }
  .aside{ margin-top:2.6rem; padding-top:1.4rem; border-top:1px solid var(--line); font-size:.9rem; color:var(--text-muted); }
  .aside a{ color:var(--gold); text-underline-offset:3px; }
</style>
</head>
<body>
  <header class="top"><div class="inner"><a href="./#clases">← Clases</a><span>NAYA</span></div></header>
  <main>
    <div class="wrap">
      <div class="eyebrow">Clases · DJ</div>
      <h1>Clases<br>de DJ</h1>
      <p class="bajada">Ingresá con tu clave para ver tu recorrido.</p>

      <form id="f" autocomplete="off">
        <input id="k" type="password" placeholder="tu clave" aria-label="Clave" required autofocus>
        <button type="submit">Entrar</button>
      </form>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>

      <p class="aside">¿Todavía no tenés clave? Escribime a <a href="mailto:ramironaya@gmail.com">ramironaya@gmail.com</a>. Podés ver el <a href="https://ramironaya-bit.github.io/Clases/">recorrido general</a> de los módulos.</p>
    </div>
  </main>

<script>
  // Cada clave se guarda como hash SHA-256 (no en texto claro) y lleva al recorrido de esa persona.
  var ACCESOS = {
    "9d9ad68d753303d39b0fcb3ba1d14961842d3e675bbc529648fb5d1ba69c5944": "https://ramironaya-bit.github.io/Clases/galgo/",
    "1360aaacd76daa3465b42443a82a84587e05d70eef0ac4d2b95d17aca51d6c04": "https://ramironaya-bit.github.io/Clases/olix/"
  };
  function sha256(text){
    var data = new TextEncoder().encode(text);
    return crypto.subtle.digest("SHA-256", data).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ("0"+b.toString(16)).slice(-2); }).join("");
    });
  }
  document.getElementById("f").addEventListener("submit", function(e){
    e.preventDefault();
    var msg = document.getElementById("msg");
    var clave = document.getElementById("k").value.trim().toLowerCase();
    if(!(window.crypto && crypto.subtle)){ msg.textContent = "Este navegador no permite verificar la clave."; return; }
    sha256(clave).then(function(h){
      if(ACCESOS[h]){ msg.style.color = "var(--gold)"; msg.textContent = "Entrando…"; window.location.href = ACCESOS[h]; }
      else { msg.style.color = "var(--terra)"; msg.textContent = "Clave incorrecta."; }
    });
  });
</script>
</body>
</html>
